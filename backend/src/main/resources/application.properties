spring.application.name=smart-parking-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Default to H2 / In-Memory with auto-fallback if PostgreSQL is not active
spring.datasource.url=jdbc:postgresql://localhost:5432/smartparking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=9a6747f6f12c45f002d664f32d3e1287a72dac267d1ceeffa770384a4e66382b
app.jwt.expiration-ms=86400000

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
