name: smart_parking
version: 1.0.0+1
publish_to: none
description: Smart Parking System - Find, book, and pay for parking in seconds
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.0.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # UI Components
  google_maps_flutter: ^2.5.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  
  # Payment (Mock for demo)
  flutter_stripe: ^9.5.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  #assets:
    #- assets/images/
    #- assets/fonts/
    #- assets/icons/
  

